name: Internal mobile release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-mobile-release-main
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build and submit Android and iOS
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify the app
        run: npm run check

      - name: Build and submit
        run: >-
          eas build --platform all --profile production --auto-submit
          --non-interactive --no-wait
